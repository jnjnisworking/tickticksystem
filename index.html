<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學號收繳查核系統 - 毀滅警報版</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 15px;
            background-color: #f0f2f5;
            color: #333;
            transition: background 0.3s;
        }
        .container {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .title-input {
            width: 100%;
            padding: 12px;
            font-size: 22px;
            font-weight: bold;
            border: 2px dashed #1a73e8;
            border-radius: 8px;
            box-sizing: border-box;
            text-align: center;
            color: #1a73e8;
            margin-bottom: 20px;
            background-color: #f8f9fa;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }
        .student-item { position: relative; }
        .student-item input[type="checkbox"] {
            position: absolute; opacity: 0; cursor: pointer; height: 0; width: 0;
        }
        .student-label {
            display: block; background-color: #ffffff; border: 2px solid #ccc;
            border-radius: 8px; padding: 15px 5px; text-align: center;
            font-size: 18px; font-weight: bold; color: #333; cursor: pointer;
            user-select: none; transition: all 0.2s ease;
        }
        .student-item input[type="checkbox"]:checked + .student-label {
            background-color: #28a745; border-color: #218838; color: #ffffff;
        }

        .btn-group { display: flex; gap: 15px; }
        .action-btn {
            flex: 1; padding: 14px; font-size: 18px; font-weight: bold;
            border: none; border-radius: 8px; cursor: pointer;
        }
        .btn-count { background-color: #1a73e8; color: white; }
        .btn-reset { background-color: #6c757d; color: white; }

        /* 🚨 毀滅級全螢幕警報視窗 🚨 */
        .doom-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            box-sizing: border-box;
            padding: 20px;
        }

        /* 瘋狂紅黑閃爍動畫 */
        @keyframes strobe {
            0% { background-color: #ff0000; }
            50% { background-color: #000000; }
            100% { background-color: #ff0000; }
        }
        .strobe-active {
            animation: strobe 0.25s infinite;
        }

        /* 震動大標題 */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(0px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(2px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(2px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        .doom-box {
            background: rgba(0, 0, 0, 0.9);
            border: 5px solid #ff0000;
            border-radius: 20px;
            padding: 40px 20px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 0 50px #ff0000;
            animation: shake 0.5s infinite;
        }

        .doom-title {
            color: #ff3333;
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #ff0000;
        }

        .doom-subtitle {
            color: #ffffff;
            font-size: 45px;
            font-weight: 900;
            margin: 20px 0;
            color: #ffcc00;
            text-shadow: 0 0 20px #ffcc00;
        }

        .doom-list {
            background: #222;
            border: 2px dashed #ff3333;
            color: #ff3333;
            padding: 20px;
            border-radius: 10px;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 25px;
            max-height: 200px;
            overflow-y: auto;
        }

        .doom-close-btn {
            background-color: #ff0000;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 0 15px #ff0000;
        }
        .doom-close-btn:hover { background-color: #cc0000; }
    </style>
</head>
<body>

<div class="container">
    <input type="text" class="title-input" id="pageTitle" value="請在此輸入收繳項目 (例如: 5/27 英文作業)">
    <div class="grid-container" id="checkboxGrid"></div>
    <div class="btn-group">
        <button class="action-btn btn-count" onclick="countUnchecked()">🔍 查核 (Count)</button>
        <button class="action-btn btn-reset" onclick="resetAll()">🔄 重設 (Reset)</button>
    </div>
</div>

<div class="doom-overlay" id="doomAlert">
    <div class="doom-box">
        <div class="doom-title">💀 終極警告 💀</div>
        <div class="doom-subtitle">請現在交出來！！</div>
        <div style="color: #aaa; font-size: 16px; margin-bottom: 5px;">以下學號尚未繳交：</div>
        <div class="doom-list" id="unsubmittedDisplay"></div>
        <button class="doom-close-btn" onclick="closeAlert()">我知道錯了，現在交！</button>
    </div>
</div>

<script>
    let audioCtx = null;
    let alarmInterval = null;
    let isAlarming = false;

    // 核心音訊驅動：空襲警報聲效
    function startSiren() {
        if (isAlarming) return;
        isAlarming = true;
        
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        let toggle = true;
        // 每 0.2 秒高低頻交替，做出類似工廠核災、極度嚴重的嗶啵警報聲
        alarmInterval = setInterval(() => {
            if (!isAlarming) return;
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            // 使用 sawtooth (鋸齒波) 或 square (方波)，聽起來非常刺耳、極具警告性
            osc.type = 'sawtooth'; 
            osc.frequency.value = toggle ? 700 : 450; // 高低音交替
            toggle = !toggle;
            
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime); // 音量
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.25);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.25);
        }, 200);
    }

    function stopSiren() {
        isAlarming = false;
        if (alarmInterval) {
            clearInterval(alarmInterval);
            alarmInterval = null;
        }
    }

    // 點擊學號普通音效
    function playClickSound() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 600;
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
    }

    // 初始化 1-38 號按鈕
    window.onload = function() {
        const grid = document.getElementById('checkboxGrid');
        for (let i = 1; i <= 38; i++) {
            const item = document.createElement('div');
            item.className = 'student-item';
            item.innerHTML = `
                <input type="checkbox" id="student_${i}" value="${i}" onchange="playClickSound()">
                <label for="student_${i}" class="student-label">${i} 號</label>
            `;
            grid.appendChild(item);
        }
    };

    // 🔍 Count 查核按鈕
    function countUnchecked() {
        let uncheckedNumbers = [];
        for (let i = 1; i <= 38; i++) {
            const cb = document.getElementById(`student_${i}`);
            if (cb && !cb.checked) {
                uncheckedNumbers.push(i);
            }
        }

        const doomAlert = document.getElementById('doomAlert');
        const displayZone = document.getElementById('unsubmittedDisplay');

        if (uncheckedNumbers.length === 0) {
            alert("🎉 太奇蹟了！全班竟然都交齊了！");
        } else {
            // 填入未交學號
            displayZone.innerHTML = uncheckedNumbers.map(n => n + "號").join(', ');
            
            // 啟動地獄級視覺與聽覺特效
            doomAlert.style.display = 'flex';
            doomAlert.classList.add('strobe-active'); // 開始紅黑閃爍
            startSiren(); // 開始大聲播放嚴重警報聲
        }
    }

    // 關閉警報
    function closeAlert() {
        const doomAlert = document.getElementById('doomAlert');
        doomAlert.style.display = 'none';
        doomAlert.classList.remove('strobe-active');
        stopSiren(); // 停止音效
    }

    // 🔄 Reset 按鈕
    function resetAll() {
        if (confirm("確定要重設所有格子嗎？")) {
            for (let i = 1; i <= 38; i++) {
                const cb = document.getElementById(`student_${i}`);
                if (cb) cb.checked = false;
            }
        }
    }
</script>

</body>
</html>
