<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr.Ng 的收功課系統</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 20px;
            padding: 10px;
            background-color: #f8f9fa;
            color: #333;
        }
        
        /* 頂部標題區域 */
        .header-section {
            text-align: center;
            margin-bottom: 25px;
        }
        h1 {
            color: #1a73e8;
            font-size: 36px;
            margin-bottom: 15px;
        }

        /* ✍️ 新增/找回的功課名稱輸入區域 */
        .homework-input-container {
            margin-bottom: 15px;
        }
        .homework-input {
            font-size: 20px;
            padding: 10px 15px;
            width: 80%;
            max-width: 500px;
            border: 2px solid #1a73e8;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
        }
        
        /* 圖例說明區域 */
        .legend-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 18px;
            font-weight: bold;
            margin-top: 15px;
        }
        .legend-item {
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }
        .legend-submitted { background-color: #d4edda; color: #155724; }
        .legend-required { background-color: #f8d7da; color: #721c24; }

        /* 撐滿橫向空間的 1-10 號網格 */
        .student-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr); /* 嚴格限制一行10個 */
            gap: 12px;
            margin: 20px 0;
            width: 100%;
        }

        /* 學生按鈕基礎樣式 */
        .student-btn {
            padding: 20px 5px;
            font-size: 22px;
            font-weight: bold;
            border: 2px solid #bbb;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            box-shadow: 0 3px 5px rgba(0,0,0,0.05);
        }
        
        /* 未點選：淺紅色 (需要遞交) */
        .not-submitted {
            background-color: #f8d7da;
            color: #721c24;
            border-color: #f5c6cb;
        }
        /* 已點選：綠色 (已遞交) */
        .submitted {
            background-color: #d4edda;
            color: #155724;
            border-color: #c3e6cb;
            transform: scale(0.96);
            box-shadow: none;
        }

        /* 功能按鈕區域 */
        .control-section {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        .action-btn {
            font-size: 24px;
            font-weight: bold;
            padding: 15px 35px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.2s;
        }
        .check-btn { background-color: #1a73e8; color: white; }
        .check-btn:hover { background-color: #1557b0; }
        .all-green-btn { background-color: #28a745; color: white; }
        .all-green-btn:hover { background-color: #218838; }
        .all-red-btn { background-color: #dc3545; color: white; }
        .all-red-btn:hover { background-color: #c82333; }

        /* 終極超大滿版彈出視窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .modal-content {
            background: #fff3cd; /* 黃色高對比警告背景 */
            border: 10px solid #ffc107;
            padding: 40px;
            border-radius: 20px;
            width: 90%;
            max-width: 1100px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .modal-title {
            font-size: 40px;
            color: #856404;
            margin-bottom: 10px;
            font-weight: 900;
        }
        .modal-subtitle {
            font-size: 28px;
            color: #1a73e8;
            margin-bottom: 20px;
            font-weight: bold;
        }
        /* 沒交功課的學號名單：超級巨大字體 */
        .missing-list {
            font-size: 65px; 
            font-weight: 900;
            color: #dc3545; /* 醒目深紅 */
            background: white;
            padding: 25px;
            border-radius: 12px;
            border: 4px dashed #dc3545;
            margin: 25px 0;
            word-wrap: break-word;
            line-height: 1.4;
            letter-spacing: 5px;
            animation: blinker 1.5s linear infinite;
        }
        @keyframes blinker {
            50% { opacity: 0.8; }
        }
        .countdown-text {
            font-size: 22px;
            color: #6c757d;
            margin-bottom: 20px;
        }
        .close-btn {
            background: #dc3545;
            color: white;
            font-size: 26px;
            font-weight: bold;
            padding: 12px 50px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }
        .close-btn:hover { background: #bd2130; }
    </style>
</head>
<body>

    <div class="header-section">
        <h1>📋 Mr.Ng 的收功課系統</h1>
        
        <div class="homework-input-container">
            <input type="text" id="homeworkName" class="homework-input" placeholder="✍️ 請輸入今日功課項目（例如：中文工作紙）...">
        </div>

        <div class="legend-container">
            <div class="legend-item legend-submitted">🟢 綠色：已遞交</div>
            <div class="legend-item legend-required">🔴 紅色：需要遞交</div>
        </div>
    </div>

    <div class="student-grid" id="studentGrid"></div>

    <div class="control-section">
        <button class="action-btn check-btn" onclick="checkSubmission()">🔍 查核結果</button>
        <button class="action-btn all-green-btn" onclick="setAllStatus(true)">🟢 全部變綠 (全交)</button>
        <button class="action-btn all-red-btn" onclick="setAllStatus(false)">🔴 全部變紅 (未交)</button>
    </div>

    <div class="modal" id="resultModal">
        <div class="modal-content">
            <div class="modal-title">🚨 仍未遞交功課學號名單 🚨</div>
            <div class="modal-subtitle" id="modalHomeworkDisplay"></div>
            <div class="missing-list" id="missingList"></div>
            <div class="countdown-text" id="countdownText">系統將於 3 秒後自動關閉...</div>
            <button class="close-btn" onclick="closeModal()">確定完成</button>
        </div>
    </div>

<script>
    var maxStudents = 38; 
    var submissionStatus = {};

    var audioCtx = null;
    var modalTimer = null;
    var countdownInterval = null;
    var currentOscillators = [];

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    // 初始化狀態：預設全部未交 (false)
    for (var i = 1; i <= maxStudents; i++) {
        submissionStatus[i] = false;
    }

    // 建立全班 1-38 號按鈕佈局
    function createGrid() {
        var grid = document.getElementById('studentGrid');
        grid.innerHTML = '';
        for (var i = 1; i <= maxStudents; i++) {
            var btn = document.createElement('button');
            btn.className = submissionStatus[i] ? 'student-btn submitted' : 'student-btn not-submitted';
            btn.id = 'student-' + i;
            btn.innerText = i + ' 號';
            
            (function(id) {
                btn.onclick = function() { toggleStudent(id); };
            })(i);
            
            grid.appendChild(btn);
        }
    }

    // 單獨切換點選狀態
    function toggleStudent(id) {
        submissionStatus[id] = !submissionStatus[id];
        var btn = document.getElementById('student-' + id);
        
        if (submissionStatus[id]) {
            btn.className = 'student-btn submitted';
            playShortTone(880, 'sine', 0.08, 0.05); 
        } else {
            btn.className = 'student-btn not-submitted';
            playShortTone(440, 'sine', 0.08, 0.05);
        }
    }

    // 一鍵變色功能
    function setAllStatus(toSubmitted) {
        var actionText = toSubmitted ? '全部變綠 (表示全班已交)' : '全部變紅 (表示全班未交)';
        if (confirm('確定要將全班狀態改為【' + actionText + '】嗎？')) {
            for (var i = 1; i <= maxStudents; i++) {
                submissionStatus[i] = toSubmitted;
            }
            createGrid(); 
            playShortTone(toSubmitted ? 700 : 300, 'sine', 0.15, 0.08);
        }
    }

    function playShortTone(freq, type, dur, vol) {
        try {
            initAudio();
            var osc = audioCtx.createOscillator();
            var gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + dur);
        } catch(e){}
    }

    // 🚨 3秒查核警告聲
    function startAlertSound() {
        try {
            initAudio();
            var now = audioCtx.currentTime;
            
            for (var i = 0; i < 15; i++) {
                var startTime = now + (i * 0.2);
                var osc = audioCtx.createOscillator();
                var gain = audioCtx.createGain();
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(i % 2 === 0 ? 650 : 550, startTime);
                
                gain.gain.setValueAtTime(0.15, startTime);
                gain.gain.setValueAtTime(0.15, startTime + 0.1);
                gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.12);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start(startTime);
                osc.stop(startTime + 0.12);
                
                currentOscillators.push(osc);
            }
        } catch(e){}
    }

    function stopAlertSound() {
        currentOscillators.forEach(function(osc) {
            try { osc.stop(); } catch(e){}
        });
        currentOscillators = [];
    }

    // 🔍 查核按鈕
    function checkSubmission() {
        clearTimers();

        // 獲取並在彈出視窗同步顯示當前功課名稱
        var hwName = document.getElementById('homeworkName').value.trim();
        var hwDisplay = document.getElementById('modalHomeworkDisplay');
        if(hwName !== "") {
            hwDisplay.innerText = "📚 當前功課： " + hwName;
            hwDisplay.style.display = "block";
        } else {
            hwDisplay.style.display = "none";
        }

        var missing = [];
        for (var i = 1; i <= maxStudents; i++) {
            if (!submissionStatus[i]) {
                missing.push(i + '號');
            }
        }

        var missingListDiv = document.getElementById('missingList');
        if (missing.length > 0) {
            missingListDiv.innerText = missing.join(' 、 ');
            missingListDiv.style.color = '#dc3545';
            missingListDiv.style.borderColor = '#dc3545';
        } else {
            missingListDiv.innerText = '🎉 全班已全部交齊！老師辛苦了！';
            missingListDiv.style.color = '#28a745';
            missingListDiv.style.borderColor = '#28a745';
        }

        var modal = document.getElementById('resultModal');
        modal.style.display = 'flex';

        startAlertSound();

        var timeLeft = 3;
        var countdownText = document.getElementById('countdownText');
        countdownText.innerText = '系統將於 ' + timeLeft + ' 秒後自動關閉...';

        countdownInterval = setInterval(function() {
            timeLeft--;
            if (timeLeft > 0) {
                countdownText.innerText = '系統將於 ' + timeLeft + ' 秒後自動關閉...';
            }
        }, 1000);

        modalTimer = setTimeout(function() {
            closeModal();
        }, 3000);
    }

    function closeModal() {
        document.getElementById('resultModal').style.display = 'none';
        stopAlertSound();
        clearTimers();
    }

    function clearTimers() {
        if (modalTimer) clearTimeout(modalTimer);
        if (countdownInterval) clearInterval(countdownInterval);
    }

    window.onload = function() {
        createGrid();
    };
</script>

</body>
</html>
